services:
  db:
    image: postgres:16-alpine
    container_name: estoque_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estoque_user
      POSTGRES_PASSWORD: estoque_pass
      POSTGRES_DB: estoque_db
    ports:
      - "5432:5432"
    volumes:
      - estoque_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque_user -d estoque_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: estoque_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://estoque_user:estoque_pass@db:5432/estoque_db?schema=public"
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  estoque_db_data: